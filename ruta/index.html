  if (d.rj) { var r = moto(d.rj); r.motivo = 'No justificada'; r.tgt = { lat: suc(r.base).lat, lng: suc(r.base).lng }; feed('❌', 'Salida de <b>' + r.n + '</b> marcada como NO justificada. Se le pidió volver.', 'r', r.id); notify(r.id, '❌ Tu salida no fue aprobada. Volvé a la sucursal.'); }
  if (d.pa) { var me = moto(PH), J2 = JOBS.find(function (j) { return j.id === me.job; }), pa = d.pa.split('|');
    if (pa[0] === 'acc') { var jj = JOBS.find(function (j) { return j.id === pa[1]; }); assign(jj, PH, false); }
    if (pa[0] === 'go' && J2) startJob(me, J2);
    if (pa[0] === 'ret' && J2) { me.wait = 0.01; }
    if (pa[0] === 'ent' && J2) finish(me, J2);
    if (pa[0] === 'qr') { var mot = me.qr; me.qr = null; qrOut(PH, mot); } }
  rCen(); rPh(); drawMap(); });
document.addEventListener('change', function (ev) { var t = ev.target;
  if (t.dataset.cfg) { CFG[t.dataset.cfg] = +t.value || 0; if (t.dataset.cfg === 'geo') drawSuc(); feed('⚙️', 'Regla cambiada: ' + t.parentNode.firstChild.textContent + ' = ' + t.value, '', null); }
  if (t.dataset.qrm && t.value) { var m = moto(t.dataset.qrm); if (m.id === PH && MANUAL) { m.qr = t.value; notify(PH, '🎫 La sucursal activó un QR de salida: ' + t.value + '. Escanealo para salir.'); feed('🎫', 'QR de salida activado para <b>' + m.n + '</b>: ' + esc(t.value) + ' (vence en 10 min)', 'y', m.id); } else if (!qrOut(m.id, t.value)) alert(m.n + ' no está libre en la base.'); }
  if (t.dataset.man) MANUAL = t.checked;
  if (t.dataset.phm) { PH = t.value; }
  rCen(); rPh(); drawMap(); });
function orderOut(m, who) { (REQ.filter(function (q) { return q.mid === m.id && q.st === 'pend'; })).forEach(function (q) { q.st = 'sal'; }); m.st = 'vuelta'; m.permAt = 0; m.permSuc = null; m.tgt = { lat: suc(m.base).lat, lng: suc(m.base).lng }; feed('🚪', 'Orden de salida para <b>' + m.n + '</b> (' + who + '): volver a ' + suc(m.base).n, 'y', m.id); notify(m.id, '🚪 ORDEN DE SALIDA: volvé ya a ' + suc(m.base).n + '.'); }
var last = Date.now(), lastDraw = 0, DOWN = false; document.addEventListener('pointerdown', function () { DOWN = true; }); document.addEventListener('pointerup', function () { setTimeout(function () { DOWN = false; }, 50); });
setInterval(function () { var n = Date.now(), dt = (n - last) / 1000; last = n; var sim = dt * SPEED; for (var i = 0; i < 4; i++) tick(sim / 4); $('#clk').textContent = hhmm(now()); drawMap();
  if (n - lastDraw > 1000 && !DOWN) { lastDraw = n; var act = document.activeElement; if (!act || !act.closest || !act.closest('#cen input, #cen select')) rCen(); rPh(); } }, 250);
if (innerWidth <= 1250 && innerWidth > 820) $('#tgPh').style.display = '';
rCen(); rPh(); drawMap(); setTimeout(function () { MAP.invalidateSize(); }, 200);
