<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruta en vivo · Nissifarma</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#0b1220;--pn:#111c33;--ln:#263247;--tx:#e2e8f0;--mu:#94a3b8;--ok:#22c55e;--wa:#f59e0b;--er:#ef4444;--ac:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:600 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0f172a;border-bottom:1px solid var(--ln);flex-wrap:wrap}
header b{font-size:17px}header .sp{flex:1}header small{color:var(--mu)}
button{border:0;border-radius:9px;padding:8px 11px;background:#334155;color:#fff;font:800 13px system-ui;cursor:pointer}button.pri{background:var(--ac)}button.ok{background:#15803d}button.no{background:#991b1b}
input,select,textarea{padding:8px;border-radius:9px;border:1px solid #475569;background:#1e293b;color:#fff;font:600 13.5px system-ui}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:calc(100vh - 56px)}#map{height:100%}
aside{overflow:auto;border-left:1px solid var(--ln);background:var(--pn)}
.tabs{display:flex;gap:4px;padding:8px;position:sticky;top:0;background:var(--pn);z-index:5;flex-wrap:wrap}.tabs button{background:#1e293b}.tabs button.on{background:var(--ac)}
.card{margin:8px;padding:10px;border-radius:12px;background:#1e293b;border-left:5px solid #475569}.card.a1{border-left-color:#60a5fa}.card.a2{border-left-color:var(--wa)}.card.a3{border-left-color:var(--er);background:#2a1620}
.card h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;gap:6px}.card .m{color:var(--mu);font-weight:500;font-size:12.5px}.card .al{margin:6px 0;padding:6px 8px;border-radius:8px;background:#3b2a0b;color:#fde68a;font-size:12.5px}.card .al.n3{background:#4c1d1d;color:#fecaca}
.card .bt{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.card .bt button{padding:6px 9px;font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px}.lst{margin:8px}.lst div{padding:7px;border-bottom:1px solid var(--ln);font-size:13px}
.ph{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px}.ph figure{margin:0;background:#1e293b;border-radius:10px;overflow:hidden}.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.ph figcaption{padding:5px;font-size:11.5px;color:var(--mu)}
#login{max-width:420px;margin:12vh auto;padding:20px;background:var(--pn);border-radius:16px}#login input{width:100%;margin:8px 0}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:2000}.ov>div{background:var(--pn);border-radius:14px;padding:16px;width:min(460px,94vw);max-height:90vh;overflow:auto}.ov label{display:block;margin:8px 0 3px;color:var(--mu)}.ov input,.ov select,.ov textarea{width:100%}
.code{font:800 26px ui-monospace,monospace;letter-spacing:3px;background:#0f172a;padding:10px;border-radius:10px;text-align:center;margin:8px 0}
@media(max-width:860px){main{grid-template-columns:1fr;grid-template-rows:45vh auto;height:auto}aside{border-left:0}}
</style>
</head>
<body>
<div id="login" hidden><h2>🛵 Ruta en vivo</h2><p class="m">Escribí la clave de administrador que pusiste en <b>config.php</b>.</p><input id="lk" type="password" placeholder="Clave"><button class="pri" id="lgo">Entrar</button><p id="lerr" style="color:#fca5a5"></p></div>
<div id="app" hidden>
<header><b>🛵 Ruta en vivo · Nissifarma</b><small id="upd"></small><span class="sp"></span><button id="bNot">🔔 Avisos</button><button id="bAll">📢 Mensaje a todos</button><button id="bNew" class="pri">➕ Nuevo celular</button><button id="bOut">Salir</button></header>
<main><div id="map"></div><aside><div class="tabs"><button data-t="cel" class="on">📱 Celulares</button><button data-t="tar">📦 Tareas</button><button data-t="mar">🕒 Marcaciones</button><button data-t="fot">📸 Fotos</button><button data-t="suc">🏪 Sucursales</button><button data-t="aj">⚙️ Ajustes</button></div><div id="side"></div></aside></main>
</div>
<script>
(function(){
var K = localStorage.getItem('ruta-k') || '', S = { t: 'cel', d: null, sel: null, hist: null, lastAl: {} }, map, layer, sucL, histL, pickMode = false;
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
function hm(t){ return t ? new Date(+t).toLocaleTimeString('es-PY', { hour: '2-digit', minute: '2-digit' }) : '—'; }
function hace(t){ if (!t) return 'nunca'; var m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'ahora' : m < 60 ? 'hace ' + m + ' min' : 'hace ' + Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }
function api(a, body){ return fetch('api.php?a=' + a, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin': K }, body: JSON.stringify(body || {}) }).then(function(r){ return r.json(); }).then(function(j){ if (!j.ok) throw new Error(j.error || 'error'); return j; }); }
function foto(f){ return 'api.php?a=foto&k=' + encodeURIComponent(K) + '&f=' + encodeURIComponent(f); }
function login(){ $('login').hidden = false; $('app').hidden = true; $('lk').focus(); }
$('lgo').onclick = function(){ K = $('lk').value.trim(); api('estado').then(function(){ localStorage.setItem('ruta-k', K); start(); }).catch(function(e){ $('lerr').textContent = e.message; }); };
$('lk').onkeydown = function(e){ if (e.key === 'Enter') $('lgo').click(); };
$('bOut').onclick = function(){ localStorage.removeItem('ruta-k'); location.reload(); };
$('bNot').onclick = function(){ if ('Notification' in window) Notification.requestPermission().then(function(p){ alert(p === 'granted' ? 'Listo: te aviso cuando haya una alerta nueva.' : 'El navegador no dio permiso.'); }); };
function start(){ $('login').hidden = true; $('app').hidden = false; if (!map) { map = L.map('map').setView([-25.51, -54.62], 13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map); layer = L.layerGroup().addTo(map); sucL = L.layerGroup().addTo(map); histL = L.layerGroup().addTo(map);
    map.on('click', function(e){ if (!pickMode) return; pickMode = false; var n = prompt('Nombre de la sucursal (ej.: KM7):'); if (!n) return; var r = +prompt('Radio en metros (zona de la sucursal):', '80') || 80; var s = (S.d.sucs || []).filter(function(x){ return x.n !== n.trim().toUpperCase(); }); s.push({ n: n.trim().toUpperCase(), lat: e.latlng.lat, lon: e.latlng.lng, r: r }); api('cfg_set', { sucs: s }).then(load); }); }
  load(); setInterval(load, 15000); }
function lvl(d){ return d.alertas.reduce(function(m, a){ return Math.max(m, a.n); }, 0); }
function load(){ api('estado').then(function(j){ S.d = j; $('upd').textContent = 'actualizado ' + hm(j.t); notify(j); paintMap(); paintSide(); }).catch(function(e){ $('upd').textContent = '⚠️ ' + e.message; if (/clave/i.test(e.message)) login(); }); }
function notify(j){ j.devs.forEach(function(d){ d.alertas.forEach(function(a){ var k = d.id + '|' + a.m.replace(/\d+/g, ''); if (a.n >= 2 && !S.lastAl[k]) { S.lastAl[k] = 1; try { if (Notification.permission === 'granted') new Notification('⚠️ ' + d.nombre, { body: a.m }); } catch (e) {} } }); }); }
function paintMap(){ layer.clearLayers(); sucL.clearLayers(); var B = [];
  (S.d.sucs || []).forEach(function(s){ L.circle([s.lat, s.lon], { radius: s.r || 80, color: '#60a5fa', weight: 1, fillOpacity: .08 }).bindTooltip('🏪 ' + s.n).addTo(sucL); B.push([s.lat, s.lon]); });
  S.d.devs.forEach(function(d){ if (!d.pos) return; var l = lvl(d), c = !d.jornada ? '#64748b' : l >= 3 ? '#ef4444' : l === 2 ? '#f59e0b' : '#22c55e'; var m = L.marker([d.pos.lat, d.pos.lon], { icon: L.divIcon({ className: '', html: '<div class="dot" style="background:' + c + '"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) }).bindTooltip(esc(d.nombre) + ' · ' + hace(+d.pos.t), { permanent: true, direction: 'right', offset: [10, 0] }); m.on('click', function(){ S.sel = d.id; S.t = 'cel'; paintSide(); }); m.addTo(layer); B.push([d.pos.lat, d.pos.lon]); });
  if (B.length && !S.fit) { S.fit = 1; map.fitBounds(B, { padding: [40, 40], maxZoom: 15 }); } }
function card(d){ var l = lvl(d), p = d.pos; return '<div class="card a' + l + '"><h3><span>' + esc(d.nombre) + '</span><span class="m">' + esc(d.rol || '') + ' · ' + esc(d.suc || '') + '</span></h3>'
  + '<div class="m">' + (d.jornada ? '🟢 En jornada desde ' + hm(d.jt) : '⚪ Fuera de jornada' + (d.jt ? ' (salió ' + hm(d.jt) + ')' : '')) + ' · 📍 ' + (d.donde ? 'en ' + esc(d.donde) : p ? 'fuera de sucursal' : 'sin datos') + ' · ' + (p ? hace(+p.t) : 'sin ubicación') + (p && p.bat != null ? ' · 🔋 ' + Math.round(p.bat * 100) + '%' : '') + (d.permOk ? ' · ✅ con permiso' : '') + '</div>'
  + d.alertas.map(function(a){ return '<div class="al n' + a.n + '">' + (a.n >= 3 ? '🔴 ' : a.n === 2 ? '🟠 ' : '🔵 ') + esc(a.m) + '</div>'; }).join('')
  + '<div class="bt"><button data-sf="' + d.id + '">📸 Pedir selfie</button><button data-hi="' + d.id + '">🗺️ Recorrido de hoy</button><button data-ta="' + d.id + '">➕ Tarea</button>' + (d.permPend && d.permiso ? '<button class="ok" data-pa="' + d.permiso.id + '">✅ Dar permiso</button><button class="no" data-pr="' + d.permiso.id + '">❌ Negar</button>' : '') + '<button data-ms="' + d.id + '">💬 Mensajes' + (d.msgNuevos ? ' (' + d.msgNuevos + ')' : '') + '</button><button data-ed="' + d.id + '">⚙️</button>' + (p ? '<button data-go="' + d.id + '">🎯</button>' : '') + '</div>'
  + (S.sel === d.id ? '<div class="lst">' + d.ev.map(function(e){ return '<div>' + hm(e.t) + ' · <b>' + esc(e.tipo.replace('_', ' ')) + '</b> ' + esc(e.nota || '') + (e.foto ? ' <a href="' + foto(e.foto) + '" target="_blank">📷</a>' : '') + (e.estado && e.estado !== 'ok' ? ' <i>(' + esc(e.estado) + ')</i>' : '') + '</div>'; }).join('') + '</div>' : '') + '</div>'; }
function paintSide(){ var h = '', d = S.d; if (!d) return; document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.t === S.t); });
  if (S.t === 'cel') { var L2 = d.devs.slice().sort(function(a, b){ return lvl(b) - lvl(a) || (b.jornada - a.jornada); }); h = (S.hist ? '<div class="row"><b>🗺️ ' + esc(S.hist.n) + ': ' + S.hist.km + ' km hoy · ' + S.hist.pts + ' puntos</b><button data-hx="1">Quitar</button></div>' : '') + (L2.map(card).join('') || '<p class="row">Todavía no hay celulares. Tocá ➕ Nuevo celular.</p>'); }
  if (S.t === 'fot') { var F = []; d.devs.forEach(function(x){ x.ev.forEach(function(e){ if (e.foto) F.push([e, x]); }); }); F.sort(function(a, b){ return b[0].t - a[0].t; }); h = '<div class="ph">' + (F.map(function(z){ return '<figure><a href="' + foto(z[0].foto) + '" target="_blank"><img loading="lazy" src="' + foto(z[0].foto) + '"></a><figcaption>' + esc(z[1].nombre) + ' · ' + esc(z[0].tipo) + ' · ' + new Date(+z[0].t).toLocaleString('es-PY') + '</figcaption></figure>'; }).join('') || '<p>Sin fotos todavía.</p>') + '</div>'; }
  if (S.t === 'suc') { h = '<div class="row"><button class="pri" data-pk="1">📍 Agregar sucursal tocando el mapa</button></div><div class="lst">' + (d.sucs || []).map(function(s, i){ return '<div>🏪 <b>' + esc(s.n) + '</b> · radio ' + (s.r || 80) + ' m <button data-sd="' + i + '">🗑️</button></div>'; }).join('') + '</div><p class="row m">La zona de cada sucursal sirve para saber si alguien está dentro o salió.</p>'; }
  if (S.t === 'aj') { var a = d.app || {}; h = '<div class="row"><label>Minutos para responder una selfie <input id="ajS" value="' + (a.selfieMin || 3) + '" style="width:60px"></label></div><div class="row"><label>Alerta «sin ubicación» después de (min) <input id="ajN" value="' + (a.sinSenalMin || 10) + '" style="width:60px"></label></div><div class="row"><label>Selfies al azar por jornada <input id="ajR" value="' + (a.azar || 0) + '" style="width:60px"></label></div><div class="row"><button class="pri" id="ajOk">Guardar</button></div><p class="row m">Selfies al azar: la app del celular pide sola una selfie en momentos imprevistos durante la jornada.</p>'; }
  if (S.t === 'mar') { var nw = new Date(), dia = S.mDia || (nw.getFullYear() + '-' + String(nw.getMonth() + 1).padStart(2, '0') + '-' + String(nw.getDate()).padStart(2, '0')); var d0 = new Date(dia + 'T00:00:00').getTime(); Promise.all([api('m_list', { desde: d0, hasta: d0 + 864e5 }), api('f_list')]).then(function(R){ if (S.t !== 'mar') return; var M = R[0].marcas, F = R[1].funcs, T = {}; (R[1].marc.tipos || []).forEach(function(x){ T[x.id] = x; }); var by = {}; M.forEach(function(m){ (by[m.cod] = by[m.cod] || []).push(m); }); var pend = M.filter(function(m){ return m.estado === 'pend'; });
      $('side').innerHTML = '<div class="row"><input type="date" id="mDia" value="' + dia + '"><a href="marcar.html" target="_blank" style="color:#93c5fd">Abrir página de marcar ↗</a></div>' + (pend.length ? '<h3 class="row">⏳ Para aprobar (' + pend.length + ')</h3>' + pend.map(function(m){ return '<div class="card a2"><h3><span>' + esc(m.nombre || m.cod) + '</span><span class="m">' + hm(m.t) + '</span></h3><div>' + esc((T[m.tipo] || {}).ic || '') + ' <b>' + esc((T[m.tipo] || {}).n || m.tipo) + '</b>' + (m.motivo ? ' · ' + esc(m.motivo) : '') + (m.quien ? ' · cubre: ' + esc(m.quien) : '') + (m.monto ? ' · ₲ ' + Number(m.monto).toLocaleString('es-PY') : '') + '</div>' + (m.nota ? '<div class="m">' + esc(m.nota) + '</div>' : '') + '<div class="bt"><button class="ok" data-ma="' + m.id + '">✓ Aprobar</button><button class="no" data-mr="' + m.id + '">✕ Rechazar</button></div></div>'; }).join('') : '')
        + '<h3 class="row">👥 Marcas del día</h3>' + (F.filter(function(f){ return f.activo; }).map(function(f){ var L2 = by[f.cod] || [], fuera = L2.filter(function(m){ return m.lat != null && m.suc_gps !== null && (m.suc_gps === '' || (f.suc && m.suc_gps.toUpperCase() !== f.suc.toUpperCase())); }); return '<div class="card' + (L2.length ? '' : ' a2') + '"><h3><span>' + esc(f.nombre) + '</span><span class="m">' + esc(f.cod) + ' · ' + esc(f.suc || '') + (f.conPin ? '' : ' · ⚠️ sin PIN') + '</span></h3>' + (L2.length ? '<div>' + L2.map(function(m){ return '<span style="display:inline-block;margin:2px 8px 2px 0">' + esc((T[m.tipo] || {}).ic || '•') + ' <b>' + hm(m.t) + '</b> ' + esc((T[m.tipo] || {}).n || m.tipo) + (m.estado === 'pend' ? ' ⏳' : m.estado === 'rech' ? ' ✕' : '') + (m.lat == null ? ' <span class="m">(sin GPS)</span>' : m.suc_gps ? ' <span class="m">en ' + esc(m.suc_gps) + '</span>' : ' <span class="m" style="color:#fca5a5">fuera de sucursal</span>') + '</span>'; }).join('') + '</div>' + (fuera.length ? '<div class="al">📍 ' + fuera.length + ' marca(s) fuera de su sucursal (puede ser cobertura)</div>' : '') + '<div class="ph" style="margin:6px 0 0;grid-template-columns:repeat(4,1fr)">' + L2.filter(function(m){ return m.foto; }).map(function(m){ return '<figure><a href="' + foto(m.foto) + '" target="_blank"><img loading="lazy" src="' + foto(m.foto) + '"></a><figcaption>' + hm(m.t) + '</figcaption></figure>'; }).join('') + '</div>' : '<div class="m">Sin marcas.</div>') + '</div>'; }).join('') || '<p class="row">Todavía no hay funcionarios. Se cargan desde la planilla del Baúl (📲 Marcaciones → Enviar funcionarios).</p>');
      var di = $('mDia'); if (di) di.onchange = function(){ S.mDia = di.value; paintSide(); }; }).catch(function(e){ $('side').innerHTML = '<p class="row">⚠️ ' + esc(e.message) + '</p>'; }); h = '<p class="row">Cargando…</p>'; }
  if (S.t === 'tar') { api('tareas_all').then(function(j){ if (S.t !== 'tar') return; $('side').innerHTML = '<div class="lst">' + (j.tareas.map(function(t){ return '<div>' + new Date(+t.t).toLocaleString('es-PY') + ' · <b>' + esc(t.tipo) + '</b> · ' + esc(t.titulo) + ' → ' + esc(t.nombre || '') + ' · <i>' + esc(t.estado) + '</i>' + (t.estado !== 'hecha' && t.estado !== 'anulada' ? ' <button data-tx="' + t.id + '">Anular</button>' : '') + '</div>'; }).join('') || 'Sin tareas en los últimos 3 días.') + '</div>'; }); h = '<p class="row">Cargando…</p>'; }
  $('side').innerHTML = h; }
function ov(html, onok){ var o = document.createElement('div'); o.className = 'ov'; o.innerHTML = '<div>' + html + '<div class="row" style="margin:12px 0 0"><button class="pri" data-ok="1">Aceptar</button><button data-cx="1">Cerrar</button></div></div>'; document.body.appendChild(o); o.onclick = function(e){ if (e.target === o || e.target.dataset.cx) o.remove(); if (e.target.dataset.ok) { if (onok) { var r = onok(o); if (r === false) return; } o.remove(); } }; return o; }
document.addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; var t = b.dataset;
  if (t.t) { S.t = t.t; paintSide(); return; }
  if (t.sf) { api('cmd_add', { dev: +t.sf, tipo: 'selfie' }).then(function(){ b.textContent = '📸 Pedida ✓'; }); return; }
  if (t.go) { var d = S.d.devs.find(function(x){ return x.id === +t.go; }); map.setView([d.pos.lat, d.pos.lon], 17); S.sel = d.id; paintSide(); return; }
  if (t.hi) { var dd = S.d.devs.find(function(x){ return x.id === +t.hi; }), t0 = new Date(); t0.setHours(0, 0, 0, 0); api('hist', { dev: +t.hi, desde: t0.getTime() }).then(function(j){ histL.clearLayers(); var P = j.pts.map(function(p){ return [p.lat, p.lon]; }); if (P.length) { L.polyline(P, { color: '#a855f7', weight: 4 }).addTo(histL); map.fitBounds(P, { padding: [30, 30] }); } j.ev.forEach(function(ev){ if (ev.lat) L.circleMarker([ev.lat, ev.lon], { radius: 6, color: '#fff', fillColor: '#f97316', fillOpacity: 1 }).bindTooltip(hm(ev.t) + ' ' + ev.tipo).addTo(histL); }); S.hist = { n: dd.nombre, km: j.km, pts: P.length }; S.sel = dd.id; paintSide(); }); return; }
  if (t.hx) { histL.clearLayers(); S.hist = null; paintSide(); return; }
  if (t.ms) { var dm = S.d.devs.find(function(x){ return x.id === +t.ms; }), o2 = ov('<h3>💬 ' + esc(dm.nombre) + '</h3><div id="mL" class="lst" style="max-height:50vh;overflow:auto">Cargando…</div><textarea id="mT" rows="2" placeholder="Escribí un mensaje"></textarea>', function(o){ var tx = o.querySelector('#mT').value.trim(); if (!tx) return false; api('msg_dir', { dev: dm.id, txt: tx }).then(function(){ o.querySelector('#mT').value = ''; ld(); }); return false; }); var ld = function(){ api('msgs_dir', { dev: dm.id }).then(function(j){ var el = o2.querySelector('#mL'); el.innerHTML = j.msgs.map(function(m){ return '<div style="text-align:' + (m.de === 'dir' ? 'right' : 'left') + '"><small class="m">' + hm(m.t) + (m.dev === 0 ? ' · a todos' : '') + '</small><br>' + (m.de === 'dir' ? '🧑‍💼 ' : '📱 ') + esc(m.txt) + '</div>'; }).join('') || 'Sin mensajes.'; el.scrollTop = 1e9; }); }; ld(); o2.querySelector('[data-ok]').textContent = 'Enviar'; return; }
  if (b.id === 'bAll') { ov('<h3>📢 Mensaje a todos los celulares</h3><textarea id="aT" rows="3"></textarea>', function(o){ var tx = o.querySelector('#aT').value.trim(); if (!tx) return false; api('msg_dir', { dev: 0, txt: tx }); }); return; }
  if (t.pa || t.pr) { api('permiso', { id: +(t.pa || t.pr), ok: !!t.pa }).then(load); return; }
  if (t.pk) { pickMode = true; alert('Tocá en el mapa el lugar de la sucursal.'); return; }
  if (t.sd) { var s = S.d.sucs.slice(); s.splice(+t.sd, 1); api('cfg_set', { sucs: s }).then(load); return; }
  if (t.ma || t.mr) { api('m_estado', { id: +(t.ma || t.mr), ok: !!t.ma }).then(paintSide); return; }
  if (t.tx) { api('tarea_upd', { id: +t.tx, estado: 'anulada' }).then(paintSide); return; }
  if (b.id === 'ajOk') { api('cfg_set', { app: { selfieMin: +$('ajS').value || 3, sinSenalMin: +$('ajN').value || 10, azar: +$('ajR').value || 0 } }).then(load); return; }
  if (t.ta) { ov('<h3>➕ Tarea para ' + esc(S.d.devs.find(function(x){ return x.id === +t.ta; }).nombre) + '</h3><label>Tipo</label><select id="tT"><option value="delivery">🛵 Delivery a cliente</option><option value="reposicion">📦 Reposición (llevar productos a una sucursal)</option><option value="reubicacion">🔁 Reubicación entre sucursales</option><option value="cobranza">💵 Cobranza</option><option value="banco">🏦 Banco</option><option value="tramite">📄 Trámite / mandado</option></select><label>Qué hay que hacer</label><input id="tN" placeholder="Ej.: llevar pedido de Juan Pérez / 3 cajas a KM8"><label>Desde</label><input id="tD" placeholder="Ej.: KM7"><label>Hacia</label><input id="tH" placeholder="Ej.: dirección o sucursal"><label>Detalle</label><textarea id="tX" rows="3" placeholder="Productos, cantidades, factura, teléfono…"></textarea>', function(o){ var n = o.querySelector('#tN').value.trim(); if (!n) { alert('Escribí qué hay que hacer.'); return false; } api('tarea_add', { dev: +t.ta, tipo: o.querySelector('#tT').value, titulo: n, desde: o.querySelector('#tD').value, hacia: o.querySelector('#tH').value, detalle: o.querySelector('#tX').value }).then(load); }); return; }
  if (t.ed) { var x = S.d.devs.find(function(z){ return z.id === +t.ed; }); ov('<h3>⚙️ ' + esc(x.nombre) + '</h3><label>Nombre</label><input id="eN" value="' + esc(x.nombre) + '"><label>Sucursal</label><input id="eS" value="' + esc(x.suc || '') + '"><label>Rol</label><select id="eR">' + ['delivery', 'reposicion', 'vendedor', 'encargado', 'kiosco', 'otro'].map(function(r){ return '<option' + (r === x.rol ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select><label>Código del funcionario dueño del celular (celular propio; vacío = celular fijo de la sucursal)</label><input id="eF" value="' + esc(x.func || '') + '" placeholder="Ej.: F008"><label><input type="checkbox" id="eA"' + (x.activo ? ' checked' : '') + ' style="width:auto"> Activo</label><button id="eTok" style="margin-top:8px">🔑 Ver código de activación</button><div id="eTk"></div>', function(o){ api('dev_upd', { id: x.id, nombre: o.querySelector('#eN').value.trim(), suc: o.querySelector('#eS').value.trim().toUpperCase(), rol: o.querySelector('#eR').value, activo: o.querySelector('#eA').checked ? 1 : 0, func: o.querySelector('#eF').value.trim().toUpperCase() }).then(load); }); document.getElementById('eTok').onclick = function(){ api('dev_token', { id: x.id }).then(function(j){ document.getElementById('eTk').innerHTML = '<div class="code">' + esc(j.token) + '</div>'; }); }; return; }
  if (b.id === 'bNew') { ov('<h3>➕ Nuevo celular</h3><label>Nombre de quien lo usa</label><input id="nN" placeholder="Ej.: Juan (delivery)"><label>Sucursal base</label><input id="nS" placeholder="Ej.: KM7"><label>Rol</label><select id="nR"><option>delivery</option><option>reposicion</option><option>vendedor</option><option>encargado</option><option value="kiosco">kiosco (celular fijo para marcar asistencia)</option><option>otro</option></select><label>Código del funcionario (solo si es su celular propio para marcar)</label><input id="nF" placeholder="Ej.: F008 — vacío si es celular fijo">', function(o){ var n = o.querySelector('#nN').value.trim(); if (!n) { alert('Escribí el nombre.'); return false; } api('dev_add', { nombre: n, suc: o.querySelector('#nS').value.trim().toUpperCase(), rol: o.querySelector('#nR').value, func: o.querySelector('#nF').value.trim().toUpperCase() }).then(function(j){ ov('<h3>✅ Listo</h3><p>Para <b>marcar asistencia</b>, abrí en ese celular: <a style="color:#93c5fd" target="_blank" href="marcar.html">' + esc(location.href.replace(/panel\.html.*$/, '')) + 'marcar.html</a> y escribí el código de abajo. Para la app de ruta (delivery):</p><p class="m">Dirección del servidor:</p><div class="code" style="font-size:14px;letter-spacing:0">' + esc(location.href.replace(/panel\.html.*$/, '')) + '</div><p class="m">Código de activación:</p><div class="code">' + esc(j.token) + '</div>'); load(); }); }); return; }
});
if (K) api('estado').then(start).catch(login); else login();
})();
