  --grid-1: #1b2329; --grid-2: #27323a; --panel: #182026; --chip: #222d34; --fre: #6ea0ff; --fon: #b48cff; --izq: #4ccf7c; --der: #ff8f4d; --int: #9aa9b2; color-scheme: dark; } }
:root[data-theme="dark"] {
