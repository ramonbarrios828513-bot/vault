name: Baúl → Cloudflare Pages
# Publica el baúl en Cloudflare Pages en cada cambio (segundos, sin trabarse).
# Se activa solo cuando el repositorio tiene el secreto CLOUDFLARE_API_TOKEN.
on:
  push:
    branches: [main]
    paths-ignore: ['ruta-app/**', 'ruta-server/**', 'tools/**', 'README.md']
  workflow_dispatch:
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Sin claves de Cloudflare todavía
        if: env.HAS_CF != 'true'
        run: echo "Faltan el secreto CLOUDFLARE_API_TOKEN; no se publica en Cloudflare."
      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'
      - name: Armar la carpeta del sitio (solo lo que usa el baúl)
        if: env.HAS_CF == 'true'
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest version.json _site/ 2>/dev/null || true
          for d in data icons blob arquitecto instalar; do [ -d "$d" ] && cp -r "$d" _site/; done
          cp arquitecto-web-latest.html _site/ 2>/dev/null || true
          printf '/*\n  Cache-Control: no-cache\n  X-Content-Type-Options: nosniff\n  Referrer-Policy: same-origin\n' > _site/_headers
      - name: Crear el proyecto la primera vez
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6f17af0479fa8a6d9c9fd45c18a0921a
          command: pages project create baul-nissi --production-branch=main
      - name: Llave de avisos (VAPID) — se crea una sola vez y queda guardada en Cloudflare
        if: env.HAS_CF == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6f17af0479fa8a6d9c9fd45c18a0921a
        run: |
          if npx -y wrangler@3 pages secret list --project-name=baul-nissi 2>/dev/null | grep -q VAPID_JWK; then echo "VAPID_JWK ya existe"; else node tools/vapid.mjs | npx -y wrangler@3 pages secret put VAPID_JWK --project-name=baul-nissi; fi
      - name: Publicar
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6f17af0479fa8a6d9c9fd45c18a0921a
          command: pages deploy _site --project-name=baul-nissi --branch=main --commit-dirty=true
